# Configuración de Redis para ejecutar dentro de un Pod de Podman

# Escuchar en todas las interfaces de red del Pod (compartidas vía localhost)
bind 0.0.0.0
protected-mode no
port 6379

# Persistencia (Append Only File) para no perder datos al reiniciar el contenedor
appendonly yes
appendfilename "appendonly.aof"
dir /data

# Límite de memoria opcional y política de desalojo (útil para caché/sesiones de Django)
maxmemory 256mb
maxmemory-policy allkeys-lru
